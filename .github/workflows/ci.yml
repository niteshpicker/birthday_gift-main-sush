name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Build & Security Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build production bundle
        env:
          VITE_SITE_URL: https://hpbd-phuong-ngoc.vercel.app
        run: npm run build

      - name: Verify bundle & static assets
        run: |
          test -f dist/index.html
          test -f dist/og-cover.png
          test -f dist/audio/Shiki-Perfect_audio.mp3
          test -f dist/images/graduate.jpg
          test -f dist/images/potrait.jpg
          test -f dist/stickers/gd.gif
          if grep -q '%OG_' dist/index.html; then
            echo "::error::Unresolved OG placeholder detected in dist/index.html"
            exit 1
          fi

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload built dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist-bundle
          path: dist/
          retention-days: 3

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-24.04
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --build-arg VITE_SITE_URL=https://hpbd-phuong-ngoc.vercel.app -t birthday-gift:ci .

      - name: Start container and run HTTP smoke tests
        run: |
          docker run -d --name birthday-gift-smoke -p 127.0.0.1:8080:80 birthday-gift:ci
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz | grep -q '^ok$'
          curl -sf http://127.0.0.1:8080/ | grep -q 'Happy Birthday'
          curl -sf http://127.0.0.1:8080/ | grep -q 'https://hpbd-phuong-ngoc.vercel.app/og-cover.png'
          curl -sfI http://127.0.0.1:8080/og-cover.png | grep -qi '200'
          curl -sfI http://127.0.0.1:8080/audio/Shiki-Perfect_audio.mp3 | grep -qi '200'
          curl -sfI http://127.0.0.1:8080/images/graduate.jpg | grep -qi '200'
          curl -sfI http://127.0.0.1:8080/stickers/gd.gif | grep -qi '200'
          curl -sf http://127.0.0.1:8080/wishes | grep -q '<div id="root">'

      - name: Cleanup container
        if: always()
        run: docker rm -f birthday-gift-smoke || true
